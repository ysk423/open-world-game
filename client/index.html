<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>SURVIVE</title>
  </head>
  <body>
    <div id="join-screen">
      <form id="join-form">
        <h1>SURVIVE</h1>
        <p id="join-subtitle">みんなで生き延びる2Dドット絵オープンワールド</p>
        <label>
          なまえ
          <input id="name-input" maxlength="16" required autocomplete="off" />
        </label>
        <button type="submit">参加する</button>
        <p id="join-hint">みんなで同じ拠点に集まれます(最大4人)</p>
      </form>
      <button id="game-reset-button" type="button">🔄 ゲームをリセット</button>
    </div>
    <!-- スマホ縦持ち時、style.cssのportraitメディアクエリで上段(HUD)/中段(ゲーム画面)/
         下段(操作ボタン)の3段に組み替えるための入れ物。横持ち/デスクトップでは各要素が
         position:fixedのままなのでこれらのコンテナ自体は見た目に影響しない -->
    <div id="hud-row"></div>
    <div id="app"></div>
    <div id="controls-row"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
