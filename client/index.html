<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>はじまりの湾</title>
  </head>
  <body>
    <div id="join-screen">
      <form id="join-form">
        <h1>はじまりの湾</h1>
        <p id="join-subtitle">ほのぼの2Dドット絵オープンワールド</p>
        <label>
          なまえ
          <input id="name-input" maxlength="16" required autocomplete="off" />
        </label>
        <button type="submit">参加する</button>
        <p id="join-hint">みんなで同じ拠点に集まれます(最大4人)</p>
      </form>
      <button id="game-reset-button" type="button">🔄 ゲームをリセット</button>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
